{% extends "base.html" %}
{% load static %}

{% block title %}Reset password — Amazon{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <h1 class="auth-title">
      Reset your password by answering the question you provided upon
      registration
    </h1>

    <form method="post" novalidate>
      {% csrf_token %}

      {% if error %}
        <div class="form-error-banner">{{ error }}</div>
      {% endif %}

      <input
        class="field"
        type="text"
        value="{{ question_label }}"
        disabled
        style="background: #eeeeee; color: #555555;"
      >

      <input
        class="field"
        type="text"
        name="security_answer"
        placeholder="Your answer"
      >

      <button type="submit" class="btn btn-block">Continue</button>
    </form>
  </div>
</div>
{% endblock %}
