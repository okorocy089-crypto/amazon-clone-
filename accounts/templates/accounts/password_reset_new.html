{% extends "base.html" %}
{% load static %}

{% block title %}Reset password — Amazon{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <h1 class="auth-title">Reset your password</h1>

    <form method="post" novalidate>
      {% csrf_token %}

      {% if error %}
        <div class="form-error-banner">{{ error }}</div>
      {% endif %}

      <input
        class="field"
        type="password"
        name="new_password"
        placeholder="Enter new password"
      >

      <input
        class="field"
        type="password"
        name="confirm_password"
        placeholder="Confirm new password"
      >

      <button type="submit" class="btn btn-block">Proceed</button>
    </form>
  </div>
</div>
{% endblock %}
