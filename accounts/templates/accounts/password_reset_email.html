{% extends "base.html" %}
{% load static %}

{% block title %}Reset password — Amazon{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <h1 class="auth-title">Enter your email to continue</h1>

    <form method="post" novalidate>
      {% csrf_token %}

      {% if error %}
        <div class="form-error-banner">{{ error }}</div>
      {% endif %}

      <input
        class="field"
        type="email"
        name="email"
        placeholder="Email"
      >

      <button type="submit" class="btn btn-block">Continue</button>
    </form>
  </div>
</div>
{% endblock %}
